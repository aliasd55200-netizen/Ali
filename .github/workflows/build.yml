name: Build Shahin

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-shahin
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1); fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;35.0.0"

      - name: Apply Shahin branding
        run: |
          cat branding/logo.b64.* | base64 -d > branding/logo.webp
          pip install --quiet pillow
          python3 branding/make_icons.py
          sed -i 's|<string name="app_name">Mlm Vpn</string>|<string name="app_name">شاهین</string>|' app/src/main/res/values/strings.xml

      - name: Load Shahin signing key
        env:
          SHAHIN_KEYSTORE_B64: ${{ secrets.SHAHIN_KEYSTORE_B64 }}
        run: |
          if [ -n "$SHAHIN_KEYSTORE_B64" ]; then
            echo "$SHAHIN_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shahin.jks"
            echo "SHAHIN_KEYSTORE=$RUNNER_TEMP/shahin.jks" >> "$GITHUB_ENV"
            echo "Signing key loaded"
          else
            echo "No signing secret set - building with the ephemeral debug key"
          fi

      - name: Build debug APK
        env:
          SHAHIN_KEYSTORE_PASSWORD: ${{ secrets.SHAHIN_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Publish APK to release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "Version: $VER"
          ARM=$(ls app/build/outputs/apk/debug/*arm64-v8a*.apk | head -1)
          UNI=$(ls app/build/outputs/apk/debug/*universal*.apk | head -1)
          cp "$ARM" "shahin-$VER-arm64-v8a.apk"
          cp "$UNI" "shahin-$VER-universal.apk"
          gh release create "v$VER" "shahin-$VER-arm64-v8a.apk" "shahin-$VER-universal.apk" --title "Shahin $VER" --notes "Shahin $VER - signed build; updates are served from this repo" || gh release upload "v$VER" "shahin-$VER-arm64-v8a.apk" "shahin-$VER-universal.apk" --clobber

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
